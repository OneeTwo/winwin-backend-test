spring.application.name=auth-api
server.port=8080

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5434/winwin_db}
spring.datasource.username=${POSTGRES_USER:winwin}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# JDBC error messages can contain SQL and user-supplied values.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.log.errors=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

data-api.url=${DATA_API_URL}
internal.token=${INTERNAL_TOKEN}
