spring.application.name=auth-api

spring.datasource.url=jdbc:h2:mem:auth_api_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=test-jwt-secret-key-at-least-32-bytes-long!!
jwt.expiration-ms=3600000

data-api.url=http://data-api.test:8081
internal.token=test-internal-token
