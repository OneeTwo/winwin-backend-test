services:
  postgres:
    image: postgres:16
    container_name: winwin-postgres
    environment:
      POSTGRES_DB: winwin_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  data-api:
    build:
      context: ./data-api
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
    ports:
      - "8081:8081"
    restart: unless-stopped

  auth-api:
    build:
      context: ./auth-api
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/winwin_db}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      DATA_API_URL: ${DATA_API_URL:-http://data-api:8081}
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      data-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
