services:
  postgres:
    image: postgres:16
    container_name: winwin-postgres
    environment:
      POSTGRES_DB: winwin_db
      POSTGRES_USER: winwin
      POSTGRES_PASSWORD: winwin_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winwin -d winwin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: